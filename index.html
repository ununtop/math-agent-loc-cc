<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>math-agent.loc.cc</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: radial-gradient(1200px 600px at 50% -10%, #1e293b 0%, #0f172a 45%, #080d17 100%);
    color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif;
    padding: 1.5rem;
  }
  main { text-align: center; max-width: 40rem; }
  .badge {
    display: inline-flex; align-items: center; gap: .45rem;
    padding: .35rem .8rem; border-radius: 999px;
    background: rgba(34,197,94,.12); border: 1px solid rgba(34,197,94,.3);
    color: #86efac; font-size: .8rem; margin-bottom: 1.5rem;
  }
  .dot {
    width: .45rem; height: .45rem; border-radius: 50%; background: #22c55e;
    box-shadow: 0 0 0 3px rgba(34,197,94,.2); animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: .45; } }
  h1 { font-size: clamp(1.6rem, 5vw, 2.5rem); margin: 0 0 .75rem; font-weight: 650; letter-spacing: -.02em; }
  p { margin: .4rem 0; opacity: .72; line-height: 1.6; }
  footer { margin-top: 2.5rem; font-size: .75rem; opacity: .38;
    border-top: 1px solid rgba(148,163,184,.14); padding-top: 1rem; }
</style>
</head>
<body>
<main>
  <div class="badge"><span class="dot"></span>Online</div>
  <h1>math-agent.loc.cc</h1>
  <p>Site under construction — stay tuned.</p>
  <footer>Served via GitHub Pages</footer>
</main>
</body>
</html>
