name: keepalive

on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stamp last-checked time
        run: date -u +"%Y-%m-%dT%H:%M:%SZ" > .last-checked
      - name: Commit
        run: |
          git config user.name  "keepalive-bot"
          git config user.email "keepalive-bot@users.noreply.github.com"
          git add .last-checked
          git commit -m "chore: keepalive $(date -u +%Y-%m)" || echo "nothing to commit"
          git push
